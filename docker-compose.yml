services:

  citrix-etl:
    build: .

    container_name: citrix_etl

    volumes:
      - .:/app

    # 把專案目錄掛進容器，由程式自己的 load_dotenv() 去讀 /app/.env。
    #
    # .env 採 `KEY ="value"` 格式（等號前有空白、值加引號），python-dotenv
    # 讀得懂，docker 的 env_file 讀不懂：
    #   - 等號前的空白會讓 docker 拒絕整份檔案
    #   - 雙引號不會被剝掉，主機名稱會變成含引號的字串而解析失敗
    #
    # log 不寫進專案目錄：程式只輸出到 stdout，由主機上的 run_etl.sh
    # 寫進 /var/log/citrix。

    # ⚠️ ODBC 驅動程式 msodbcsql18 裝在 image 內，註冊在 image 的
    # /etc/odbcinst.ini。若掛載主機的同名檔，會蓋掉這份註冊，
    # 導致找不到 "ODBC Driver 18 for SQL Server"。

    environment:

      # ODBC
      ODBCINI: /etc/odbc.ini
      ODBCSYSINI: /etc

      # Charset
      #
      # 一併解決 log 的編碼問題：utils/logger.py 會 print 中文與 emoji，
      # 主控台若不是 UTF-8 會拋 UnicodeEncodeError，把真正的錯誤訊息蓋掉。
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8

    network_mode: "host"

    command: tail -f /dev/null

    restart: unless-stopped

    tty: true

    stdin_open: true
